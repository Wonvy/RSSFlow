<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Blog · loaded with JavaScript</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #fafaf9; color: #222; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .post-card { background: #fff; border: 1px solid #e7e5e4; border-radius: 10px; overflow: hidden; }
    .post-card .cover { height: 110px; background: linear-gradient(135deg, #fed7aa, #fca5a5); }
    .post-card .inner { padding: 12px 14px; }
    .post-card .post-title { font-weight: 700; color: #111; text-decoration: none; display: block; margin-bottom: 4px; }
    .post-card .excerpt { color: #57534e; font-size: 14px; margin: 6px 0 0; }
    .post-card time { color: #a8a29e; font-size: 12px; }
    .loading { color: #a8a29e; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Demo Blog</h1>
    <p>The posts below are rendered by JavaScript after the page loads — a plain HTTP fetch sees nothing.</p>
    <div id="app"><p class="loading">Loading…</p></div>
  </div>
  <script>
    setTimeout(async () => {
      const res = await fetch('data.json');
      const posts = await res.json();
      document.getElementById('app').innerHTML = '<div class="grid">' + posts.map(p => `
        <article class="post-card">
          <div class="cover"></div>
          <div class="inner">
            <a class="post-title" href="/posts/${p.slug}">${p.title}</a>
            <time datetime="${p.date}">${new Date(p.date).toDateString()}</time>
            <p class="excerpt">${p.excerpt}</p>
          </div>
        </article>`).join('') + '</div>';
    }, 300);
  </script>
</body>
</html>
